    .stories-chart .label.still_possible, .stories-chart .label.recognizable { fill: var(--ink); }
    .stories-chart .label.obsolete, .stories-chart .label.period_piece { fill: var(--muted); }
    .stories-chart .marker { stroke: none; }

    .stories-chart .entry.past .marker { fill: var(--past); }
    .stories-chart .open { fill: var(--muted); }
    .stories-chart .entry.interactive:focus { outline: none; }
    .stories-chart .entry.interactive:focus .marker, .stories-chart .entry.interactive:hover .marker { stroke: var(--accent); stroke-width: 3; }

    .stories-chart .targeted .marker { stroke: var(--accent); stroke-width: 3; }
    .stories-chart .apex { stroke: var(--accent); stroke-width: 1.2; stroke-dasharray: 3 3; opacity: 0.9; }
