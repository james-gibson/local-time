name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 26, the LTS line from 2026-10-28. `.nvmrc` pins the same major
        # for local work. `engines` declares `>=20.0.0`, so 26 sits inside the
        # supported range rather than at its floor: the versions below it are
        # supported on paper and untested here. Still a single entry rather
        # than a range — an untested matrix entry is a claim, not a guarantee.
        node-version:
          - 26.x

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # `postinstall` runs `prisma generate`, so the generated client exists before Lint
      # and Typecheck read `prisma/` (both cover it now — tsconfig.scripts.json,
      # james-gibson/local-time#161). Test runs the seed round-trip against a throwaway
      # SQLite file, so no DATABASE_URL is needed anywhere in this job.
      - name: Install
        run: npm ci

      # `src/config/universes/imported/` is git-ignored (the compendia are
      # private), so the generated tree is deliberately absent here and the
      # tree-dependent assertions in generated-registration.test.ts skip. The
      # audit of that tree is asserted against synthetic drift instead, so it
      # still runs in this job — see that file for the split.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Test the lore pipeline scripts
        run: npm run test:scripts
